#
# Clemente Compute Tray MaxQ MP FFT v4
#
# ChangeLog
#    - v1
#       1. base on clemente_ct_mp_fft_v10 
#       2. Update BKC to MAXQ_0423
#       3. Add excluded_sensors for SensorCheck
#     -v3
#       1. Add IOB_Sensor_WR before SensorCheck
#     -v4
#       1. Add AC cycle and CheckCX8Status at beginning
#

- name: SledAcCycle~DUT
  reboot: true
  args:
    always: true
    runtime: 3000
    product: clemente
#    conditional_reboot: true

# ----- Check CX8 Status
- name: InstallRPM~mft_4.32.0-20250821
  runner: bash
  cmd: 'ls; cd /tmp && wget -nv http://controller/tools/platforms/clemente/rpm/mstflint-4.32.0-fb.el9.aarch64.rpm && rpm -ivh --force mstflint-4.32.0-fb.el9.aarch64.rpm; '

- name: InstallRPMPackage~CheckCX8Status
  runner: bash
  cmd: 'ls ; cd /tmp; wget -nv http://controller/tools/platforms/clemente/utils/CheckCX8Status.sh; chmod +x CheckCX8Status.sh; ./CheckCX8Status.sh || { rm -f /tmp/CheckCX8Status.sh; exit 1; }'

- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

# ----- RTCDriftTest

- name: RTCDriftTest
  args:
    drift_check: false
    drift_threshold: 600
    skip_reboot: true

# ----- SEL clear

- name: SELClear
  timeout: 1800
  args:
    whitelist: {
      'clemente': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
    }

- name: GB300StatusCheck
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/CheckGB300Status.sh

- name: LFOBMCNTPSetting~remove_controller_url
  args:
    remove: true

- name: OOB_FW_Flash~bmc_flash-check_only
  proxy: controller
  timeout: 1800
  do_not_interrupt: false
  args:
    check_only: true
    force_update: false
    fru: bmc
    component: ct_bmc
    postreboot: false
    fw_version: 'clemente-v2026.15.1'

# workaround for avoid CPLD read fail issue
- name: GB300StatusCheck~FRU_Check_WR
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/clemente_fru_check_wr.sh

- name: CPLDFlash~interposer_check_only
  args:
    check_only: true
    fru: 'interposer'
    component: 'cpld'
    fw_version: '00010120'
    postreboot: false

- name: ClementeCPLDFlash~scm_check_only
  args:
    check_only: true
    postreboot: false
    fru: 'scm'
    component: 'cpld'
    fw_version: 'D0010233'

- name: CPLDFlash~hdd0_check_only
  args:
    check_only: true
    fru: 'hdd0'
    component: 'cpld'
    fw_version: '000B0402'
    postreboot: false

- name: CPLDFlash~hdd1_check_only
  args:
    check_only: true
    fru: 'hdd1'
    component: 'cpld'
    fw_version: '000B0402'
    postreboot: false

- name: ClementeVRFlash~check_only
  args:
    check_only: true
    force_option: false
    cycle_threshold: 14
    vr_info:
      Renesas:
        fw_version:
          'PDB_P12V_N1_VR': '80031801'
          'PDB_P12V_N2_VR': '80031801'

- name: OOB_FW_Flash~sbios_check_only
  args:
    check_only: true
    force_update: false
    fru: hmc
    component: sbios
    postreboot: false
    fw_version: 'CLE403'

# ----- GB300 version check

- name: ClementeGB300VersionCheck
  args:
    check_list: {
      'HGX_FW_BMC_0': 'GB200Nvl-25.09-2',
      'HGX_FW_CPLD_0': '0.22',
      'HGX_FW_CPU_0': 'CLE403',
      'HGX_FW_CPU_1': 'CLE403',
      'HGX_FW_ERoT_BMC_0': '01.04.0031.0000_n04',
