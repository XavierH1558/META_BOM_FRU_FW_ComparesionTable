# ----- ConfigCheck
- name: ConfigCheck
  args:
    fava_skip_tests: [ test_fw, test_fan_speed, test_hw, test_hw_cpu_cores_count, test_nic_info, test_uuid, test_check_slot]
    bom_override: {'cpu_speed~overwrite': {'min_speed': 3.2, 'max_speed': 3.5}}

# ----- SNCheck

- name: SNCheck
  args:
    fava_skip_tests: [test_cpu,test_dimm,test_mb]
    nic_entries: [
        "enP22s22np0",
        "enP6s6np0",
        "enP16s16f0np0",
        "enP16s16f1np1",
        "enP18s18f0np0",
        "enP18s18f1np1",
        "enP2s2f0np0",
        "enP2s2f1np1",
        "enp3s0f0np0",
        "enp3s0f1np1"
    ]

# ----- PartCheck

- name: PartCheck
  args:
    fava_skip_tests: [test_motherboard, test_server, test_memory]

# ----- RTCDriftTest

- name: RTCDriftTest~check_only
  continue_on_fail: false
  args:
    clock_sync: false
    drift_threshold: 600

# ----- dmesg check

- name: DMESG_check
  #ignore_fail: '_all_'
  args:
    cycles: 1
    dmesg_filters_file: etc/dmesg_filters_clemente.json
#    dump_all_errors: true

# ----- SEL check

- name: SELCheck
#  retries: 2
#  retry_delay: 60
  args:
    cycles: 1
    hours_threshold: 24
    ucc_threshold : 0
    ecc_threshold: 100
    sel_filters_file: etc/sel_filters_clemente_mp.json
    product: clemente
#    log_type: "redfish"
#    dump_all_errors: true

# ----- SDR check
- name: InstallRPMPackage~clemente
  runner: bash
  cmd: 'ls ; cd /tmp; wget -nv http://controller/tools/platforms/clemente/rpm/clemente_rpm_6.16.1-0_fbk0.tar.gz ; tar xzfv /tmp/clemente_rpm_6.16.1-0_fbk0.tar.gz ; cd /tmp/clemente_rpm_6.16.1-0_fbk0; ./pre_install_clemente.sh; rm /tmp/clemente_rpm_6.16.1-0_fbk0.tar.gz  ; rm -rf /tmp/clemente_rpm_6.16.1-0_fbk0/'

- name: InstallRPMPackage~cuda_580.105.08
  runner: bash
  cmd: 'mkdir /tmp/cuda/ ; cd /tmp/cuda/; wget -nv http://controller/tools/platforms/clemente/rpm/cuda-580.105.08_20251208.tgz; tar xzfv /tmp/cuda/cuda-580.105.08_20251208.tgz; rpm -ivh /tmp/cuda/*rpm --nodeps --force; rpm -ivh /var/nvidia-driver*/*.rpm --nodeps --force; systemctl enable nvidia-persistenced.service ; systemctl start nvidia-persistenced.service;  rm -rf /tmp/cuda/'

- name: SleepTest~30sec
  args:
    duration: 30

- name: SendFilesToBMC~Copy_WR_script
  retries: 1
  args:
     files_to_copy:
        - file_location: '/tools/platforms/clemente/utils/IOB_Sensor_WR_v2.sh'
          file_destination: '/tmp/'
          file_permission: '777'
 
- name: RunOOBCmd~Run_WR
  args:
    cmd: 'cd /tmp; /tmp/IOB_Sensor_WR_v2.sh'

- name: SensorCheck
  args:
    cycles: 1
    excluded_sensors: 'IOB0_NIC0_OSFP_TEMP_C,IOB0_NIC1_OSFP_TEMP_C,IOB1_NIC0_OSFP_TEMP_C,IOB1_NIC1_OSFP_TEMP_C'

