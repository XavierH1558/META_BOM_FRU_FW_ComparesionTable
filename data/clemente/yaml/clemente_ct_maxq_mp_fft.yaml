- name: RunOOBCmd~dump_gb300_0_fru
  args:
      cmd: 'busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/PG548_0'
      expected_result: 'GB300 MaxQ 1CPU:2GPU 12H Board PC'

# ----- Dump FRU - GB300_1

- name: RunOOBCmd~dump_gb300_1_fru
  args:
      cmd: 'busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/PG548'
      expected_result: 'GB300 MaxQ 1CPU:2GPU 12H Board PC'

# ----- Check Leak Cable

- name: ClementeLeakCableCheck
  proxy: controller

# ----- Factory reset BMC to restore BMC log size

- name: RunOOBCmd~factory_reset
  args:
      cmd: 'fw_setenv openbmconce factory-reset'

# ----- PXESet

- name: PXEset
  continue_on_fail: false
  runner: bash
  cmd: touch /shared/fava/pxe/$(ip a s enP6s6np0|sed -e '/ether/!d' -e 's/.*ether \([a-f0-9:]\{17\}\).*/\1/')

# AC
- name: SledAcCycle
  reboot: true
  args:
    always: true
    runtime: 3000
    product: clemente

# ----- PXEVerify

- name: PXEVerify

# ----- SEL clear

- name: SELClear
  timeout: 1800
  args:
    whitelist: {
      'clemente': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
    }

- name: L10_FFT_COMPLETE
  runner: bash
  cmd: "/bin/true"
