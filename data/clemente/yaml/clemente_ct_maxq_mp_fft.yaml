      'HGX_FW_GPU_3': '97.10.59.00.13',
      'HGX_PCIeSwitchConfig_0': '01151024',
    }

- name: InstallRPM~mft
  runner: bash
  cmd: 'mlxfwmanager -h &> /dev/null || { cd /tmp && wget -nv http://controller/tools/platforms/clemente/rpm/mft-4.32.0-120.arm64.rpm && rpm -ivh mft-4.32.0-120.arm64.rpm; }'

- name: ClementeNICFlash~FENIC~check_only
  timeout: 1800
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: true
    keyword: 'OCP3.0'
    clear_sel: False
    postreboot: False
    force_update: False
    device_count: 2
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_version': '28.47.2526'}

- name: ClementeNICFlash~BENIC~check_only
  timeout: 1800
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: true
    keyword: 'Mezzanine'
    clear_sel: False
    postreboot: False
    force_update: False
    device_count: 4
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_version': '40.47.1106'}

# ----- SSD FW check

- name: SSDFlash~check_only
  do_not_interrupt: true
  args:
    check_quantity: true
    check_only: true
#    part_numbers_skip_reset_postcheck: ['MZOL63T8HDLT-00AFB']
#    msg_skip_reset_postcheck: "Reset: Network dropped connection on reset"
