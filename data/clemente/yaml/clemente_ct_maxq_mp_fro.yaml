- name: NVDiagCheck~PD_60002-rev3~Field_IST
  retries: 0
  args:
    field_diag_pkg: 'partnerdiag'
    extra_args: ['--field', '--ist', '--no_bmc', '--fail_on_first_error', '--skip_driver_load']
    test_recipe: 'spec_gb300_nvl_2_4_board_pc_field_ist.json'
