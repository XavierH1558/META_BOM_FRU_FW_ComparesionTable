    ist_pkg: 'DFX_GB110_IST_Field_Full_Images_b110.1.1.tar.gz'
    pkg_folder_name: '629-24059-0000-FLD-60002-rev3_nonvlink'
    log_folder_name: 'dgx'
    log_subfolder_name: 'logs'
    is_partner_diag: true

