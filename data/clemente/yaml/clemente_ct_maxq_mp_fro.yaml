# ----- PD test

- name: RunOOBCmd~Fan_Mode_manual
  args:
    cmd: 'mfg-tool fan-mode -m'
    expected_result: '"zone1": "manual"'

- name: RunOOBCmd~Set_FAN_Duty_50
  args:
    cmd: 'mfg-tool fan-speed -t 50'

- name: SleepTest~20s
  args:
    duration: 20

- name: InstallRPMPackage~clemente
  runner: bash
  cmd: 'ls ; cd /tmp; wget -nv http://controller/tools/platforms/clemente/rpm/clemente_rpm_6.16.1-0_fbk0.tar.gz ; tar xzfv /tmp/clemente_rpm_6.16.1-0_fbk0.tar.gz ; cd /tmp/clemente_rpm_6.16.1-0_fbk0; ./pre_install_clemente.sh; rm /tmp/clemente_rpm_6.16.1-0_fbk0.tar.gz  ; rm -rf /tmp/clemente_rpm_6.16.1-0_fbk0/'

- name: InstallRPMPackage~cuda_580.105.08
  runner: bash
  cmd: 'mkdir /tmp/cuda/ ; cd /tmp/cuda/; wget -nv http://controller/tools/platforms/clemente/rpm/cuda-580.105.08_20251208.tgz; tar xzfv /tmp/cuda/cuda-580.105.08_20251208.tgz; rpm -ivh /tmp/cuda/*rpm --nodeps --force; rpm -ivh /var/nvidia-driver*/*.rpm --nodeps --force; systemctl enable nvidia-persistenced.service ; systemctl start nvidia-persistenced.service;  rm -rf /tmp/cuda/'

- name: InstallRPMPackage~disable_acs
  runner: bash
  cmd: 'ls ; cd /tmp; wget -nv http://controller/tools/platforms/clemente/utils/disable_acs.sh; chmod +x disable_acs.sh; ./disable_acs.sh;'

- name: RunOOBCmd~Enable_GPU0_IST_PRC
  args:
    cmd: "curl -i -k http://172.31.13.251/redfish/v1/Systems/HGX_Baseboard_0/Processors/GPU_0 -X PATCH -H \"Content-Type: application/json\" -d '{\"Oem\": {\"Nvidia\":{\"InbandReconfigPermissions\":{\"InSystemTest\":{\"AllowOneShotConfig\": true}}}}}' 2> /dev/null"
