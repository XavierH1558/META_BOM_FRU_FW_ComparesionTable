#
# Clemente Compute Tray MaxQ MP FRO v4
#
# ChangeLog
#    - v1
#       1. base on clemente_ct_mp_fro_v10 
#       2. Update BKC to MAXQ_0423
#       3. Add excluded_sensors for SensorCheck
#       4. Change to use ModifyTempSettings.15.1.sh since service name changed in BMC 15.1
#     -v3
#       1. Add IOB_Sensor_WR before SensorCheck
#     -v4
#       1. Add PD IST test
#

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

- name: SledAcCycle
  reboot: true
  args:
    always: true
    runtime: 3000
    product: clemente

- name: ModifyTempThreshold
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/ModifyTempSettings.15.1.sh

- name: GB300StatusCheck
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/CheckGB300Status.sh

# ----- SEL clear

- name: SELClear
  timeout: 1800
  args:
    whitelist: {
      'clemente': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
    }

# ----- Check FW/CPLD version

- name: OOB_FW_Flash~bmc_flash-check_only
  proxy: controller
  timeout: 1800
  do_not_interrupt: false
  args:
    check_only: true
    force_update: false
    fru: bmc
    component: ct_bmc
    postreboot: false
    fw_version: 'clemente-v2026.15.1'

# workaround for avoid CPLD read fail issue
- name: GB300StatusCheck~FRU_Check_WR
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/clemente_fru_check_wr.sh

- name: CPLDFlash~interposer_check_only
  args:
    check_only: true
    fru: 'interposer'
    component: 'cpld'
    fw_version: '00010120'
    postreboot: false

- name: ClementeCPLDFlash~scm_check_only
  args:
    check_only: true
    postreboot: false
    fru: 'scm'
    component: 'cpld'
    fw_version: 'D0010233'

- name: CPLDFlash~hdd0_check_only
  args:
    check_only: true
    fru: 'hdd0'
    component: 'cpld'
    fw_version: '000B0402'
    postreboot: false

- name: CPLDFlash~hdd1_check_only
  args:
    check_only: true
    fru: 'hdd1'
    component: 'cpld'
    fw_version: '000B0402'
    postreboot: false

- name: ClementeVRFlash~check_only
  args:
    check_only: true
    force_option: false
    cycle_threshold: 14
    vr_info:
      Renesas:
        fw_version:
          'PDB_P12V_N1_VR': '80031801'
          'PDB_P12V_N2_VR': '80031801'

- name: OOB_FW_Flash~sbios_check_only
  args:
    check_only: true
    force_update: false
    fru: hmc
    component: sbios
    postreboot: false
    fw_version: 'CLE403'

# ----- GB300 version check

- name: ClementeGB300VersionCheck
  args:
    check_list: {
      'HGX_FW_BMC_0': 'GB200Nvl-25.09-2',
      'HGX_FW_CPLD_0': '0.22',
      'HGX_FW_CPU_0': 'CLE403',
      'HGX_FW_CPU_1': 'CLE403',
      'HGX_FW_ERoT_BMC_0': '01.04.0031.0000_n04',
