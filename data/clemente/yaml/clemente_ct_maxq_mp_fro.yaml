  cmd: 'mkdir /tmp/cuda/ ; cd /tmp/cuda/; wget -nv http://controller/tools/platforms/clemente/rpm/cuda-580.105.08_20251208.tgz; tar xzfv /tmp/cuda/cuda-580.105.08_20251208.tgz; rpm -ivh /tmp/cuda/*rpm --nodeps --force; rpm -ivh /var/nvidia-driver*/*.rpm --nodeps --force; systemctl enable nvidia-persistenced.service ; systemctl start nvidia-persistenced.service;  rm -rf /tmp/cuda/'

- name: SleepTest~30sec
  args:
    duration: 30

- name: SendFilesToBMC~Copy_WR_script
  retries: 1
  args:
     files_to_copy:
        - file_location: '/tools/platforms/clemente/utils/IOB_Sensor_WR_v2.sh'
          file_destination: '/tmp/'
          file_permission: '777'
 
- name: RunOOBCmd~Run_WR
  args:
    cmd: 'cd /tmp; /tmp/IOB_Sensor_WR_v2.sh'

- name: SensorCheck
  args:
    cycles: 1
    excluded_sensors: 'IOB0_NIC0_OSFP_TEMP_C,IOB0_NIC1_OSFP_TEMP_C,IOB1_NIC0_OSFP_TEMP_C,IOB1_NIC1_OSFP_TEMP_C'

# ----- AC cycle - 5 loops

- loop: 5
  name: HostACCycleBlock
  group:
  - name: SledAcCycle
    reboot: true
    args:
      always: true
      runtime: 3000
      product: clemente
  # workaround for avoid CPLD read fail issue
  - name: GB300StatusCheck~FRU_Check_WR
    proxy: controller
    args:
      script_file: /opt/tools/platforms/clemente/utils/clemente_fru_check_wr.sh
  - name: ConfigCheck
    args:
      fava_skip_tests: [ test_fw, test_fan_speed, test_hw, test_hw_cpu_cores_count, test_nic_info, test_uuid, test_check_slot]
      bom_override: {'cpu_speed~overwrite': {'min_speed': 3.2, 'max_speed': 3.5}}
  - name: PartCheck
    args:
      fava_skip_tests: [test_motherboard, test_server, test_memory]

