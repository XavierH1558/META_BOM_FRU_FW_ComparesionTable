# META VR200 (SanMiguel) L10 Station 1 - Functional Verification Test (FVT)
station: "Station 1 (FVT)"
description: "FVT Hardware & Firmware Verification Suite"
version: "1.0.0"

fw_checks:
  - step_id: "STEP_101"
    step_name: "Verify_BMC_Firmware"
    component: "BMC"
    sub_component: "Primary BMC"
    expected_version: "2.14.0"
    command: "ipmitool mc info"
    discussion_note: "Matches BKC standard release"

  - step_id: "STEP_102"
    step_name: "Verify_System_BIOS"
    component: "System BIOS"
    sub_component: "Host BIOS"
    expected_version: "1.0.4"
    command: "dmidecode -t bios"
    discussion_note: "FVT uses v1.0.4, BKC targets v1.0.5. Need to confirm if FVT update is required."

  - step_id: "STEP_103"
    step_name: "Verify_CPU_CPLD"
    component: "CPU CPLD"
    sub_component: "MB CPLD"
    expected_version: "1.0.4"
    command: "cpld_util --get-version"
    discussion_note: "Compliant with BKC Table"

  - step_id: "STEP_104"
    step_name: "Verify_NIC_Firmware"
    component: "NIC FW"
    sub_component: "Mellanox CX6"
    expected_version: "22.35.1000"
    command: "mstflint -d 01:00.0 q"
    discussion_note: "Check CX-6 FW build"

  - step_id: "STEP_105"
    step_name: "Verify_VR_VDD_Controller"
    component: "VR Controller"
    sub_component: "VR_VDD"
    expected_version: "1.2.0"
    command: "i2cget -y 1 0x60 0x00"
    discussion_note: "VR FW matches release candidate"
