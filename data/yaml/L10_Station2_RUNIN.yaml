# META VR200 (SanMiguel) L10 Station 2 - Run-In Test (RUNIN)
station: "Station 2 (RUNIN)"
description: "Run-In Stress & Firmware Consistency Test Suite"
version: "1.0.1"

tests:
  - step_id: "RUNIN_001"
    test_step: "Check_BMC_FW_Build"
    component: "BMC"
    sub_component: "Primary BMC"
    fw_version: "2.14.0"
    command: "obmcutil status"

  - step_id: "RUNIN_002"
    test_step: "Check_System_BIOS_Release"
    component: "System BIOS"
    sub_component: "Host BIOS"
    fw_version: "1.0.5"
    command: "nvram --get BIOS_VER"

  - step_id: "RUNIN_003"
    test_step: "Check_EXP_CPLD_Revision"
    component: "EXP CPLD"
    sub_component: "Sequencer CPLD"
    fw_version: "0.12.0"
    command: "cpld_util --exp-ver"

  - step_id: "RUNIN_004"
    test_step: "Check_PCIe_Retimer_Firmware"
    component: "Retimer"
    sub_component: "PCIe Switch Retimer"
    fw_version: "2.4.0"
    command: "lspci -vvv | grep Retimer"
    note: "RUNIN script has v2.4.0, BKC requires v2.4.1"

  - step_id: "RUNIN_005"
    test_step: "Check_FPGA_Build"
    component: "FPGA"
    sub_component: "Main Baseboard FPGA"
    fw_version: "3.1.0"
    command: "fpgautil -v"
