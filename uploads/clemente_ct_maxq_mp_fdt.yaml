# ----- Disable manual AP mode

- name: RunOOBCmd~disable_cpu0_manual_boot
  proxy: controller
  args:
    cmd: curl -k -u root:0penBmc http://172.31.13.251/redfish/v1/Chassis/HGX_ERoT_CPU_0 -d '{"Oem":{"Nvidia":{"ManualBootModeEnabled":false}}}' -X PATCH 2>/dev/null
    expected_result: '"The request completed successfully."'

- name: RunOOBCmd~disable_cpu1_manual_boot
  proxy: controller
  args:
    cmd: curl -k -u root:0penBmc http://172.31.13.251/redfish/v1/Chassis/HGX_ERoT_CPU_1 -d '{"Oem":{"Nvidia":{"ManualBootModeEnabled":false}}}' -X PATCH 2>/dev/null
    expected_result: '"The request completed successfully."'

- name: RunOOBCmd~check_cpu0_manual_boot_disabled
  proxy: controller
  args:
    cmd: 'curl -s -k -u root:0penBmc http://172.31.13.251/redfish/v1/Chassis/HGX_ERoT_CPU_0 | grep ManualBootModeEnabled'
    expected_result: '"ManualBootModeEnabled": false'

- name: RunOOBCmd~check_cpu1_manual_boot_disabled
  proxy: controller
  args:
    cmd: 'curl -s -k -u root:0penBmc http://172.31.13.251/redfish/v1/Chassis/HGX_ERoT_CPU_1 | grep ManualBootModeEnabled'
    expected_result: '"ManualBootModeEnabled": false'

