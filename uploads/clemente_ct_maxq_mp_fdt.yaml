- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

- name: OOB_FW_Flash~bmc_flash-check_only
  proxy: controller
  timeout: 1800
  do_not_interrupt: false
  args:
    check_only: true
    force_update: false
    fru: bmc
    component: ct_bmc
    postreboot: false
    fw_version: 'clemente-v2026.15.1'

# ----- Increase BMC log size to 1M

- name: NPIOOBFlash~Update_BMC_log_size
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: 'None'
    fw_file: 'tools/platforms/clemente/utils/server.ttyS2.conf'
    copy_fw_util: False
    cmd: 'cp {fw_file} /etc/obmc-console/'

- name: RunOOBCmd~restart_console_server
  proxy: controller
  args:
    cmd: 'systemctl restart obmc-console@ttyS2.service'

# workaround for avoid CPLD read fail issue
- name: GB300StatusCheck~FRU_Check_WR
  proxy: controller
  args:
    script_file: /opt/tools/platforms/clemente/utils/clemente_fru_check_wr.sh

