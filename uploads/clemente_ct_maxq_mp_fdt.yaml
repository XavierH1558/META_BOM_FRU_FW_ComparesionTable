# ----- NIC Flash

- name: InstallRPM~mft
  runner: bash
  cmd: 'mlxfwmanager -h &> /dev/null || { cd /tmp && wget -nv http://controller/tools/platforms/clemente/rpm/mft-4.32.0-120.arm64.rpm && rpm -ivh mft-4.32.0-120.arm64.rpm; }'

- name: ClementeNICFlash~FENIC
  timeout: 1800
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: False
    keyword: 'OCP3.0'
    clear_sel: False
    postreboot: False
    force_update: False
    device_count: 2
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_file': 'tools/platforms/clemente/firmware/MP/nic/cx7_fe_nic/fw-ConnectX7-rel-28_47_2526-CX75343AMC-NEAC_FB_Ax-UEFI-14.40.10-FlexBoot-3.8.201.signed.bin',
      'fw_version': '28.47.2526'
    }

- name: ClementeNICFlash~BENIC
  timeout: 3600
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: False
    keyword: 'Mezzanine'
    clear_sel: False
    postreboot: False
    force_update: False
    device_count: 4
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_file': 'tools/platforms/clemente/firmware/MP/nic/cx8_be_nic/fw-ConnectX8-rel-40_47_1106-900-9X86E-A5CX-ST0_Ax-UEFI-14.40.10-FlexBoot-3.8.201.signed.bin',
      'fw_version': '40.47.1106'}

