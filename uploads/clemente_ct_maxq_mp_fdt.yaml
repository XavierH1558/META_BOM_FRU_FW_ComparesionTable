- name: InstallRPMPackage~cuda_580.105.08
  runner: bash
  cmd: 'mkdir /tmp/cuda/ ; cd /tmp/cuda/; wget -nv http://controller/tools/platforms/clemente/rpm/cuda-580.105.08_20251208.tgz; tar xzfv /tmp/cuda/cuda-580.105.08_20251208.tgz; rpm -ivh /tmp/cuda/*rpm --nodeps --force; rpm -ivh /var/nvidia-driver*/*.rpm --nodeps --force; systemctl enable nvidia-persistenced.service ; systemctl start nvidia-persistenced.service;  rm -rf /tmp/cuda/'

- name: SleepTest~30sec
  args:
    duration: 30

- name: SendFilesToBMC~Copy_WR_script
  retries: 1
  args:
     files_to_copy:
        - file_location: '/tools/platforms/clemente/utils/IOB_Sensor_WR_v2.sh'
          file_destination: '/tmp/'
          file_permission: '777'
 
- name: RunOOBCmd~Run_WR
  args:
    cmd: 'cd /tmp; /tmp/IOB_Sensor_WR_v2.sh'

- name: SensorCheck
  args:
    cycles: 1
    excluded_sensors: 'IOB0_NIC0_OSFP_TEMP_C,IOB0_NIC1_OSFP_TEMP_C,IOB1_NIC0_OSFP_TEMP_C,IOB1_NIC1_OSFP_TEMP_C'

#
# syslog check
#
#- name: SysLogCheck
#  args:
#    #err_threshold: '<1360000'
#    syslog_filter_file: etc/syslog_filter_clemente.txt

#
# FW info
#
- name: RunOOBCmd~show_fw_version
  args:
      cmd: 'fw-util all --version'

#
# RTCDriftTest
#
- name: RTCDriftTest~check_only
  continue_on_fail: false
  args:
    clock_sync: false
    drift_threshold: 600

#
# SEL clear
#
- name: SELClear
  timeout: 1800
  args:
    whitelist: {
      'clemente': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
    }

- name: L10_FDT_COMPLETE
  runner: bash
  cmd: "/bin/true"
