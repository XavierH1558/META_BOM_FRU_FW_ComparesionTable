#
# Clemente Compute Tray MaxQ MP FDT v4
#
# ChangeLog
#    - v1
#       1. base on clemente_ct_mp_fdt_v10 
#       2. Update BKC to MAXQ_0423
#       3. Add excluded_sensors for SensorCheck
#       4. Change to use ModifyTempSettings.15.1.sh since service name changed in BMC 15.1
#     -v2
#       1. Add 10 times AC cycle for PDB MOS issue.
#       2. Add CheckWedge400PSUVoltage to check PSU voltage
#     -v3
#       1. Remove CheckWedge400PSUVoltage and 10 times AC cycle
#       2. Add IOB_Sensor_WR before SensorCheck
#     -v4
#       1. Add SBIOS load default after update SBIOS
#

# ----- Check if BMC online

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

# ----- SEL clear

- name: SELClear
  proxy: controller
  timeout: 1800
#  retries: 1
#  retry_delay: 30
  args:
    whitelist: {
      'channel islands clemente - gb300': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
      'clemente': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared'
      ],
    }

# ----- Update BMC

- name: OOB_FW_Flash~bmc_flash
  proxy: controller
  timeout: 1800
  do_not_interrupt: true
  reboot: false
  args:
    allow_error: true
    check_only: false
    force_update: false
    fru: bmc
    component: ct_bmc
    postreboot: false
    fw_version: 'clemente-v2026.15.1'
    fw_file: tools/platforms/clemente/firmware/MP/bmc/flash-clemente-v2026.15.1

- name: SledAcCycle~Proxy
  proxy: controller
  reboot: true
  args:
    always: true
    runtime: 3000
    product: clemente
    skip_postreboot_check: true

# since ac cycle command not worked, so use i2c command first.
#- name: RunOOBCmd~ac_cycle
#  proxy: controller
#  args:
#    without_check: True
