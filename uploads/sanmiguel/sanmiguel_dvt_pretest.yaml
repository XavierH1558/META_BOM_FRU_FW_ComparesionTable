#
# San Miguel Compute Tray L11 Pretest V4 Draft
#
# 1. Remove duplicate LFOBMCNTPSetting
# 2. Replace NICFlashFlexible~FENIC with MultiNICFlash~FENIC
#     Because the NV 0.5.1 FW NIC requires a configuration change (4 to 2), the NIC interface name will change.
# 3. Add SanMiguelDisableFENic
# 4. Add SanMiguelMACCheck~BE_Case5
# 5. NV_FRU_Check_WA add L11 args
# 6. Change SanMiguelBENICConfigTest to SanMiguelBENICConfigTest~cea_map

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

# wait 1 min for bmc/hmc ready for sel clear
- name: SleepTest~1min
  proxy: controller
  args:
    duration: 60

- name: SELClear
  proxy: controller
  timeout: 1800
  args:
    whitelist:
      {
        "channel islands san miguel - vr200":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
        "sanmiguel":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
      }

- name: BMCFlash
  proxy: controller
  do_not_interrupt: true
  args:
    allow_error: true
    check_only: false
    force_update: false
    postreboot: false
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.27.0
    fw_file: "/tools/platforms/sanmiguel/firmware/dvt/bmc/flash-sanmiguel-v2026.27.0"

- name: SledAcCycle~Proxy
  proxy: controller
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel
    skip_postreboot_check: true

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

- name: BMCFlash~check_only
  proxy: controller
  do_not_interrupt: true
  args:
    check_only: true
    force_update: false
    postreboot: false
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.27.0

- name: LFOBMCNTPSetting~add_controller_url
  proxy: controller

- name: NPIOOBFlash~Update_BMC_log_size
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/server.VSER14.conf_no_baud"
    copy_fw_util: False
    cmd: "cp {fw_file} /etc/obmc-console/server.VSER14.conf && systemctl restart obmc-console@VSER14.service"

# wait 3 min for bmc ready
- name: SleepTest~3min
  proxy: controller
  args:
    duration: 180

- name: NPIOOBFlash~MCU_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_MCU_WA.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file}"

- name: NPIOOBFlash~NV_FRU_Check_WA
