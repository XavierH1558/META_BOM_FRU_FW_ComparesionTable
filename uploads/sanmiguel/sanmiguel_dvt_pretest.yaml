    cmd: journalctl -u pldmd; pldmtool fw_update GetFirmwareParameters -m 30; pldmtool fw_update GetFirmwareParameters -m 40; pldmtool fw_update GetFirmwareParameters -m 50; pldmtool fw_update GetFirmwareParameters -m 60; pldmtool fw_update GetFirmwareParameters -m 70
