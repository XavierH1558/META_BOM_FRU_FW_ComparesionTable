#
# San Miguel Compute Tray DVT FDT v3
#
# ChangeLog
#    - v1
#    ---  Based on "sanmiguel_ct_evt_fdt_v1"
#    ---  FW BKC DVT_WW25_20260626
#    ---  Disable HMC transition update
#    ---  Add NIC SMA check and update
#    ---  Since NV 0.5.1 did not release a GPU driver, disable InstallNVIDIAGPUDriver
#    ---  SensorCheck skip GPU power due to no GPU driver
#    ---  Enable dump_all_errors
#    ---  Add SMA_update_debug to dump update log
#    - v2
#    ---  ConfigCheck skip test_mem_manufacturer
#    ---  SanMiguelCX9Firmware disable postreboot
#    - v3
#    ---  Add a check for missing NV FRUs and automatic rescan after an AC cycle
#    ---  SanMiguelAPStatusCheck~SBIOS~GPU retry increased from 1 to 2 times
#    - v4 - igs
#    --- Disable SanMiguelSMMCarrierMACCheck MAC flash 
#    - v5 - igs
#    --- Add DMESG and SEL check after IBWrite Config1

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

# wait 1 min for bmc/hmc ready for sel clear
- name: SleepTest~1min
  proxy: controller
  args:
    duration: 60

- name: SELClear
  proxy: controller
  timeout: 1800
#  retries: 1
#  retry_delay: 30
  args:
    whitelist: {
      'channel islands san miguel - vr200': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Cleared'
      ],
      'sanmiguel': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Cleared'
      ],
    }

- name: BMCFlash
  proxy: controller
  do_not_interrupt: true
  args:
    allow_error: true
    check_only: false
    force_update: false
    postreboot: false 
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.26.1.quanta
    fw_file: '/tools/platforms/sanmiguel/firmware/dvt/bmc/flash-sanmiguel-v2026.26.1.quanta'

- name: SledAcCycle~Proxy
  proxy: controller
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel
    skip_postreboot_check: true

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

- name: BMCFlash~check_only
  proxy: controller
  do_not_interrupt: true
  args:
    check_only: true
    force_update: false
    postreboot: false 
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.26.1.quanta

# ----- Increase BMC log size to 1M

- name: NPIOOBFlash~Update_BMC_log_size
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: 'None'
    fw_file: 'tools/platforms/sanmiguel/utils/server.VSER14.conf_no_baud'
    copy_fw_util: False
    cmd: 'cp {fw_file} /etc/obmc-console/server.VSER14.conf && systemctl restart obmc-console@VSER14.service'

# wait 3 min for bmc ready
- name: SleepTest~3min
  proxy: controller
  args:
    duration: 180

# Check for missing NV FRU workaround
- name: NPIOOBFlash~NV_FRU_Check_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: 'None'
    fw_file: 'tools/platforms/sanmiguel/utils/Check_NV_FRU.sh'
    copy_fw_util: False
    cmd: 'chmod +x {fw_file} && {fw_file}'

