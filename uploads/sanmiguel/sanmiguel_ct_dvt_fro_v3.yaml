  args:
    cycles: 1
    hours_threshold: 24
    ucc_threshold : 0
    ecc_threshold: 100
    sel_filters_file: etc/sel_filters_sanmiguel.json
    product: sanmiguel
#    log_type: "redfish"
    dump_all_errors: true

