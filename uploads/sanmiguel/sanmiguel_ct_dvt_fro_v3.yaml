# ----- FIO test

- name: SanMiguelFIOTest~BootDrive
  continue: true
  args:
    only_boot_device: true
    fio_job_args:
      rw: randrw
      rwmixread: 50
      time_based: 1
      iodepth: 32
      direct: 1
      ramp_time: 10s
      runtime: 3600
      offset: 16G
      bssplit: 4K/20:8K/10:16K/10:32K/10:64K/10:128K/20:256K/10:512K/10
      numjobs: 4
      group_reporting: 1
      ioengine: libaio

- name: SanMiguelFIOTest~DataDrive
  continue: true
  args:
    exclude_boot_device: true
    fio_job_args:
      direct: 1
      ioengine: libaio
      refill_buffers: 1
      norandommap: 1
      randrepeat: 0
      time_based: 1
      iodepth: 64
      iodepth_low: 1
      runtime: 3600
      numjobs: 16
      group_reporting: 1
      rw: randrw
      percentage_random: 100,25,0
      rwmixread: 50
      bssplit: 4K/20:8K/10:16K/10:32K/10:64K/10:128K/20:256K/10:512K/10

