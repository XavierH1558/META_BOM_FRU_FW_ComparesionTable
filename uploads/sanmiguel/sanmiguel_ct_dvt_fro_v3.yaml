# ----- Background SEL check

- name: SELCheck~background
  background: true
  retries: 0
  args:
    interval: 120
    hours_threshold: 24
    ucc_threshold : 0
    ecc_threshold: 1
    pcie_error_threshold: 3
    sel_filters_file: etc/sel_filters_sanmiguel.json
    product: sanmiguel
#    log_type: "redfish"
    dump_all_errors: true

# ----- Background Dmesg check

- name: DMESG_check~background
  background: true
  #ignore_fail: '_all_'
  args:
    bg_interval: 223
    heartbeat_interval: 660
    dmesg_filters_file: etc/dmesg_filters_sanmiguel.json
    dump_all_errors: true

