- name: DisableNetworkManagerManageBENIC
  runner: bash
  cmd: 'for dev in enP1p3s0f0np0 enP1p3s0f1np1 enP3s6f0np0 enP3s6f1np1 enP4p3s0f0np0 enP4p3s0f1np1 enP6s11f0np0 enP6s11f1np1 enP9p3s0f0np0 enP9p3s0f1np1 enP11s16f0np0 enP11s16f1np1 enP12p3s0f0np0 enP12p3s0f1np1 enP14s21f0np0 enP14s21f1np1; do sudo nmcli device set "$dev" managed no; done'

- name: NPIOOBFlash~Start_PD_sensor_record
  retries: 1
  retry_rand_delay: 10
  args:
    allow_error: False
    fw_util: 'None'
    fw_file: 'tools/platforms/sanmiguel/utils/F0W_sensor_record'
    copy_fw_util: False
    cmd: 'chmod +x {fw_file} && cd /tmp && ((nohup {fw_file} < /dev/null > /dev/null 2>&1 &) &)'

- name: NVDiagCheck~PD_r10.179_2.30.3
  args:
    field_diag_pkg: 'partnerdiag'
    extra_args: ['--mfg', '--run_spec=spec_vr_nvl72_l10_partner_mfg_case5_wo_FE.json', '--run_on_error', '--no_bmc', '--skip_driver_load','--skip_tests=SyslogErrorCheck,KernLogErrorCheck,DmesgLogErrorCheck,SyslogAERCheck,KernLogAERCheck,DmesgLogAERCheck,DisableBfCxInterfacesFromNetworkManager,EnableBfCxInterfacesFromNetworkManager,NvmeBootDrivePcie,NvmeDataDrivePcie,NvmeBootDriveBandwidth,NvmeDataDriveBandwidth,DpuStress,BfCpuPcieStress,CpuPcieTraffic,CpuGpuPowerPulseBgCx,CpuSocVdd']
    test_recipe: 'spec_vr_nvl72_l10_partner_mfg_case5_wo_FE.json'
    sku_file: 'sku_vr_nvl72_l10_partner_mfg.json'
    package_loc: 'platforms/sanmiguel/tools/NVPD/L10/'
    Partner_tools: 'VR_NVL72_L10_Compute-r10.179_2.30.3-PD.tgz'
    pkg_folder_name: 'VR_NVL72_L10_Compute-r10.179_2.30.3-PD'
    log_folder_name: 'dgx'
    log_subfolder_name: 'logs'
    is_partner_diag: true

- name: RunOOBCmd~Get_PD_sensor_record
  args:
    cmd: kill -9 $(ps | grep /tmp/F0W_sensor_record | grep -v grep | awk '{print $1}'); cat /tmp/log_Thermal_SDR/Thermal_SDR.log; rm -rf /tmp/log_Thermal_SDR
    without_check: true

- name: SledAcCycle~DUT
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel

