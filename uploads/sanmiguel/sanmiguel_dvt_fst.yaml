# ----- ConfigCheck
- name: ConfigCheck
  args:
    fava_skip_tests:
      [
        test_fw,
        test_fan_speed,
        test_hw,
        test_hw_cpu_cores_count,
        test_nic_info,
        test_uuid,
        test_check_slot,
        test_battery,
        test_mem_manufacturer,
      ]

# ----- SNCheck
- name: SNCheck
  args:
    fava_skip_tests: [test_cpu, test_dimm, test_mb]
    nic_entries:
      [
        "enP13s20f0np0",
        "enP1p3s0f0np0",
        "enP3s6f0np0",
        "enP4p3s0f0np0",
        "enP6s11f0np0",
        "enP9p3s0f0np0",
        "enP11s16f0np0",
        "enP12p3s0f0np0",
        "enP14s21f0np0",
      ]

- name: PartCheck
  args:
    fava_skip_tests: [test_motherboard, test_server, test_memory]

- name: RTCDriftTest~check_only
  continue_on_fail: false
  args:
    clock_sync: false
    drift_threshold: 600

- name: DMESG_check
  args:
    cycles: 1
    dmesg_filters_file: etc/dmesg_filters_sanmiguel.json
    dump_all_errors: true

- name: SELCheck
  args:
    cycles: 1
    hours_threshold: 24
    ucc_threshold: 0
    ecc_threshold: 100
    sel_filters_file: etc/sel_filters_sanmiguel.json
    product: sanmiguel
    dump_all_errors: true

# ----- SDR check
- name: RPMInstaller~sanmiguel~rc22
  args:
    rpm_package: tools/platforms/sanmiguel/rpm/sanmiguel_rpm_6.19.2-0_fbk0_rc22_centos10_cleaned.tar.gz

- name: SleepTest~10sec
  args:
    duration: 10

- name: SensorCheck
  args:
    cycles: 1
    excluded_sensors: "IOB0_NIC0_OSFP_TEMP_C,IOB0_NIC1_OSFP_TEMP_C,IOB1_NIC0_OSFP_TEMP_C,IOB1_NIC1_OSFP_TEMP_C,IOB2_NIC0_OSFP_TEMP_C,IOB2_NIC1_OSFP_TEMP_C,IOB3_NIC0_OSFP_TEMP_C,IOB3_NIC1_OSFP_TEMP_C,NS_NIC_OSFP_TEMP_C,HGX_GPU0_DRAM_PWR_W,HGX_GPU0_ENERGY_J,HGX_GPU0_PWR_W,HGX_GPU0_THERMAL_MARGIN_TEMP_C,HGX_GPU1_DRAM_PWR_W,HGX_GPU1_ENERGY_J,HGX_GPU1_PWR_W,HGX_GPU1_THERMAL_MARGIN_TEMP_C,HGX_GPU2_DRAM_PWR_W,HGX_GPU2_ENERGY_J,HGX_GPU2_PWR_W,HGX_GPU2_THERMAL_MARGIN_TEMP_C,HGX_GPU3_DRAM_PWR_W,HGX_GPU3_ENERGY_J,HGX_GPU3_PWR_W,HGX_GPU3_THERMAL_MARGIN_TEMP_C,NvidiaNSM_SMA_30_LEAKDETECTOR_0,NvidiaNSM_SMA_50_LEAKDETECTOR_0"

# ----- FW info
- name: RunOOBCmd~show_fw_version
  args:
    cmd: "mfg-tool version-display 2>/dev/null;hmc-util --version all"

# ----- FRU dumps
- name: RunOOBCmd~dump_fio_fru
  proxy: controller
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/San_Miguel_FIO_DVT"
    expected_result: "San Miguel FIO DVT"

- name: RunOOBCmd~dump_pdb_fru
  proxy: controller
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/San_Miguel_PDB_DVT"
    expected_result: "San Miguel PDB DVT"

- name: RunOOBCmd~dump_scm_fru
  proxy: controller
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/San_Miguel_SCM_DVT"
    expected_result: "San Miguel SCM DVT"

- name: RunOOBCmd~dump_smm_carrier_fru
  proxy: controller
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/San_Miguel_SMM_Carrier_DVT"
    expected_result: "San Miguel SMM Carrier DVT"

- name: RunOOBCmd~dump_smm_extender_fru
  proxy: controller
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/San_Miguel_SMM_Extender_DVT"
    expected_result: "San Miguel SMM Extender DVT"

- name: RunOOBCmd~dump_vr200_0_fru
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/PG558"
    expected_result: "Vera Rubin NVL72 1CPU:2GPU HPM LC"

- name: RunOOBCmd~dump_vr200_1_fru
  args:
    cmd: "busctl introspect xyz.openbmc_project.FruDevice /xyz/openbmc_project/FruDevice/PG558_0"
    expected_result: "Vera Rubin NVL72 1CPU:2GPU HPM LC"

# ----- Factory reset BMC to restore BMC log size
- name: RunOOBCmd~factory_reset
  args:
    cmd: "fw_setenv openbmconce factory-reset"

# AC
- name: SledAcCycle
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel

- name: NPIOOBFlash~MCU_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_MCU_WA.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file}"

# Check for missing NV FRU workaround
- name: NPIOOBFlash~NV_FRU_Check_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_NV_FRU.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file} L11"

# ----- SEL clear
- name: SELClear
  timeout: 1800
  args:
    whitelist:
      {
        "sanmiguel":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
      }

- name: L11_FST_COMPLETE
  runner: bash
  cmd: "/bin/true"
