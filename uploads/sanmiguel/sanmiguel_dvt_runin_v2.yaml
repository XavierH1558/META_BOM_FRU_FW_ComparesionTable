#
# San Miguel Compute Tray L11 Runin
#
# 1. Remove SanMiguelDisableFENic
# 2. NV_FRU_Check_WA -> L11
# 3. PCICheck -> SanMiguelPCICheck
# 4. Add HostUpCheck after SanMiguelAPStatusCheck

- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

- name: SledAcCycle
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel

- name: SanMiguelAPStatusCheck
  proxy: controller
  reboot: false
  args:
    sleep_time: 900
    retry: 2
    ap_name: HGX_FW_BMC_0
      HGX_FW_ERoT_BMC_0
      HGX_FW_CPLD_0
      HGX_FW_CPLD_1
      HGX_FW_GPU_SMA_0
      HGX_FW_GPU_SMA_1
      HGX_FW_ProcessorModule_SMA_0
      HGX_FW_ProcessorModule_SMA_1
      HGX_SBIOS_FMC_0
      HGX_SBIOS_FMC_1
      HGX_SBIOS_FW_0
      HGX_SBIOS_FW_1
      HGX_FW_GPU_0
      HGX_FW_GPU_1
      HGX_FW_GPU_2
      HGX_FW_GPU_3

- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

- name: NPIOOBFlash~MCU_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_MCU_WA.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file}"

- name: NPIOOBFlash~NV_FRU_Check_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_NV_FRU.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file} L11"

- name: SELClear
  timeout: 1800
  args:
    whitelist:
      {
        "sanmiguel":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
      }

- name: BMCFlash~check_only
  proxy: controller
  args:
    check_only: true
    force_update: false
    postreboot: false
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.27.0

- name: OOB_FW_Flash~IOB_SMA~Check_only
  proxy: controller
  timeout: 1800
  do_not_interrupt: true
  args:
    check_only: true
    force_update: false
    fru: iob
    component: sma
    postreboot: false
    fw_version: 0027.01.0266.0000
      0027.01.0266.0000
      0027.01.0266.0000
      0027.01.0266.0000

- name: OOB_FW_Flash~CX9_Clover_SMA~Check_only
  proxy: controller
  timeout: 1800
  args:
    check_only: true
    force_update: false
    fru: clover
    component: sma
    postreboot: false
    fw_version: "0034.01.0263.0000"

- name: SanMiguelHMCFlash~VR200_all_check
  proxy: controller
  timeout: 4000
  reboot: false
  args:
    check_only: true
    force_update: false
    force_option: true
    fru: hmc
    component: all
    postreboot: false
    fw_version:
      HGX_FW_BMC_0: "VRH-2605-01.02"
      HGX_FW_CPLD_0: "0.2C"
      HGX_FW_CPLD_1: "0.2C"
      HGX_FW_ERoT_BMC_0: "02.00.0023.0000_n05"
      HGX_FW_GPU_0: "99.00.16.00.28"
      HGX_FW_GPU_1: "99.00.16.00.28"
      HGX_FW_GPU_2: "99.00.16.00.28"
      HGX_FW_GPU_3: "99.00.16.00.28"
      HGX_FW_GPU_SMA_0: "0023.01.0261.0004"
      HGX_FW_GPU_SMA_1: "0023.01.0261.0004"
      HGX_FW_ProcessorModule_SMA_0: "0026.01.0263.0000"
      HGX_FW_ProcessorModule_SMA_1: "0026.01.0263.0000"
      HGX_SBIOS_FMC_0: "05.08.00.02"
      HGX_SBIOS_FMC_1: "05.08.00.02"
      HGX_SBIOS_FW_0: "2A.01.00.00"
      HGX_SBIOS_FW_1: "2A.01.00.00"

- name: RPMInstaller~mft
  args:
    force: true
    rpm_package: tools/platforms/sanmiguel/rpm/mft-4.35.0-6007.arm64.rpm

- name: MultiNICFlash~FENIC~check_only
  timeout: 1800
  do_not_interrupt: true
  args:
    check_only: true
    device_keyword: "North South SuperNIC"
    device_count: 2
    clear_sel: False
    postreboot: False
    force_update: False
    mellanox: { "fw_tool": "/usr/bin/mlxfwmanager", "fw_version": "82.48.1326" }

- name: MultiNICFlash~BENIC~check_only
  timeout: 3600
  do_not_interrupt: true
  args:
    check_only: true
    device_keyword: "Quad ConnectX-9 SuperNIC"
    device_count: 8
    clear_sel: False
    postreboot: False
    force_update: False
    mellanox: { "fw_tool": "/usr/bin/mlxfwmanager", "fw_version": "82.48.1326" }

- name: SSDFlash~check_only
  do_not_interrupt: true
  args:
    check_quantity: true
    check_only: true
    skip_chk_aft_flash: true
    ssd_info:
      MZTL67T6HBLC-00AFB:
        vendor: samsung
        fw_version: LDD66F2Q
      MTFDLBT7T6THC-1BK4FABVA:
        vendor: micron
        fw_version: E5FB004
      WUL6BA176O9P8X7:
        vendor: wd
        fw_version: RG109W0B

- name: LFFRUEeprom~FRU_check_only
  args:
    check_only: true
    fru_util: tools/platforms/sanmiguel/utils/fruid-util.py
    fru_config: etc/fru_sanmiguel_chk_dvt.json
    components_info:
      {
        hpm0: { eeprom: 1-0051, dev_file: PG558 },
        hpm1: { eeprom: 3-0051, dev_file: PG558_0 },
        scm: { eeprom: 10-0050, dev_file: San_Miguel_SCM_DVT },
        pdb: { eeprom: 9-0050, dev_file: San_Miguel_PDB_DVT },
        fio: { eeprom: 14-0050, dev_file: San_Miguel_FIO_DVT },
        smm: { eeprom: 5-0050, dev_file: San_Miguel_SMM_Carrier_DVT },
        smmext: { eeprom: 13-0055, dev_file: San_Miguel_SMM_Extender_DVT },
      }

- name: SELClear
  timeout: 1800
  args:
    whitelist:
      {
        "sanmiguel":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
      }

- name: DMESG_check
  args:
    cycles: 1
    dmesg_filters_file: etc/dmesg_filters_sanmiguel.json
    dump_all_errors: true

- name: SledAcCycle
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel

- name: NPIOOBFlash~MCU_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_MCU_WA.sh"
