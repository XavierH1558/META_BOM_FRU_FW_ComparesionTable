- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

- name: SleepTest~1min
  args:
    duration: 60

- name: SELClear
  timeout: 1800
  args:
    whitelist:
      {
        "sanmiguel":
          [
            "BMC-severity:OK-Event log cleared by user.",
            "BMC-severity:OK-com.meta.RedfishClient.UnexpectedException",
            "BMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared",
            "HMC-severity:OK-xyz.openbmc_project.Logging.Cleared",
          ],
      }

- name: SELCheck~background
  background: true
  retries: 0
  args:
    interval: 120
    hours_threshold: 24
    ucc_threshold: 0
    ecc_threshold: 1
    pcie_error_threshold: 3
    sel_filters_file: etc/sel_filters_sanmiguel.json
    product: sanmiguel
    dump_all_errors: true

- name: DMESG_check~background
  background: true
  args:
    bg_interval: 223
    heartbeat_interval: 660
    dmesg_filters_file: etc/dmesg_filters_sanmiguel.json
    dump_all_errors: true

- name: RPMInstaller~sanmiguel~rc22
  args:
    rpm_package: tools/platforms/sanmiguel/rpm/sanmiguel_rpm_6.19.2-0_fbk0_rc22_centos10_cleaned.tar.gz

- name: SleepTest~2mins
  args:
    duration: 120

- name: CSST~VR200_DVT1_Build_NoCuda_Concurrency_MEM_only.json
  timeout: 5400
  args:
    package_loc: "platforms/sanmiguel/tools/CSST/"
    test_pkg: VR200_DVT1_Build_NoCuda_Concurrency_1hr
    csst_tool: csst_vr_march24_no_cuda
    config_file: VR200_DVT1_Build_NoCuda_Concurrency_MEM_only.json

- name: SleepTest~2min
  args:
    duration: 120

# AC
- name: SledAcCycle~DUT
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel

- name: NPIOOBFlash~MCU_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_MCU_WA.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file}"

# Check for missing NV FRU workaround
- name: NPIOOBFlash~NV_FRU_Check_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: "None"
    fw_file: "tools/platforms/sanmiguel/utils/Check_NV_FRU.sh"
    copy_fw_util: False
    cmd: "chmod +x {fw_file} && {fw_file} L11"

- name: RPMInstaller~sanmiguel~rc22
  args:
    rpm_package: tools/platforms/sanmiguel/rpm/sanmiguel_rpm_6.19.2-0_fbk0_rc22_centos10_cleaned.tar.gz

- name: SleepTest~10sec
  args:
    duration: 10

- name: SanMiguelFIOTest~BootDrive
  continue: true
  args:
    only_boot_device: true
    fio_job_args:
      rw: randrw
      rwmixread: 50
      time_based: 1
      iodepth: 32
      direct: 1
      ramp_time: 10s
      runtime: 3600
      offset: 16G
      bssplit: 4K/20:8K/10:16K/10:32K/10:64K/10:128K/20:256K/10:512K/10
      numjobs: 4
      group_reporting: 1
      ioengine: libaio

- name: SanMiguelFIOTest~DataDrive
  continue: true
  args:
    exclude_boot_device: true
    fio_job_args:
      direct: 1
      ioengine: libaio
      refill_buffers: 1
      norandommap: 1
      randrepeat: 0
      time_based: 1
      iodepth: 64
      iodepth_low: 1
      runtime: 3600
      numjobs: 16
      group_reporting: 1
      rw: randrw
      percentage_random: 100,25,0
      rwmixread: 50
      bssplit: 4K/20:8K/10:16K/10:32K/10:64K/10:128K/20:256K/10:512K/10

# Approximately 80 minutes
- name: MlucasTest
  timeout: 7200
  args:
    controller_tool_path: tools/platforms/sanmiguel/tools/Mlucas-21.0.2
    size: medium
    cpu: "0:351"
    iters: 500

#### SSD Smart Check ####
- name: SMARTCheck
  args:
    cycles: 1

- name: NvmeOCPSmartlogCheck
  args:
    device_list:
      [
        "/dev/nvme0n1",
        "/dev/nvme1n1",
        "/dev/nvme2n1",
        "/dev/nvme3n1",
        "/dev/nvme4n1",
      ]
    check_param: "PCIe correctable error count"
    expected_value: "0"

