- name: OOB_FW_Flash~IOB_SMA~Check_only
  proxy: controller
  timeout: 1800
  do_not_interrupt: true
  args:
    check_only: true
    force_update: false
    fru: iob
    component: sma
    postreboot: false
    fw_version: 
      0027.01.0266.0000
      0027.01.0266.0000
      0027.01.0266.0000
      0027.01.0266.0000

- name: OOB_FW_Flash~CX9_Clover_SMA~Check_only
  proxy: controller
  timeout: 1800
  args:
    check_only: true
    force_update: false
    fru: clover
    component: sma
    postreboot: false
    fw_version: '0034.01.0263.0000'

- name: InstallRPM~mft
  runner: bash
  cmd: 'mlxfwmanager -h &> /dev/null || { cd /tmp && wget -nv http://controller/tools/platforms/sanmiguel/rpm/mft-4.35.0-6007.arm64.rpm && rpm -ivh --force --nosignature mft-4.35.0-6007.arm64.rpm; }'

#mst stop for MultiNICFlash
- name: MST_Stop
  runner: bash
  cmd: 'mst stop'

- name: MultiNICFlash~FENIC~check_only
  timeout: 1800
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: true
    device_keyword: 'North South SuperNIC'
    device_count: 2
    clear_sel: False
    postreboot: False
    force_update: False
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_version': '82.48.1326'
    }

- name: MultiNICFlash~BENIC~check_only
  timeout: 3600
#  retries: 2
  do_not_interrupt: true
  args:
    check_only: true
    device_keyword: 'Quad ConnectX-9 SuperNIC'
    device_count: 8
    clear_sel: False
    postreboot: False
    force_update: False
    mellanox: {
      'fw_tool': '/usr/bin/mlxfwmanager',
      'fw_version': '82.48.1326'}

