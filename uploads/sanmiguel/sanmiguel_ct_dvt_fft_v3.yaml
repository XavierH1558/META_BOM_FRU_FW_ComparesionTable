#
# San Miguel Compute Tray DVT FFT v3
#
# ChangeLog
#    - v1
#    ---  Based on "sanmiguel_ct_evt_fft_v1"
#    ---  FW BKC DVT_WW25_20260626
#    ---  Add NIC SMA check
#    ---  Since NV 0.5.1 did not release a GPU driver, disable InstallNVIDIAGPUDriver
#    ---  SensorCheck skip GPU power due to no GPU driver
#    ---  Enable dump_all_errors
#    - v2
#    ---  ConfigCheck skip test_mem_manufacturer
#    - v3
#    ---  Add a check for missing NV FRUs and automatic rescan after an AC cycle

- name: HostUpCheck~BMC
  proxy: controller
  args:
    bmc_only: true
    runtime: 3000

- name: SledAcCycle~Proxy
  proxy: controller
  reboot: true
  args:
    always: true
    runtime: 3000
    product: sanmiguel
    skip_postreboot_check: true

- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

# Check for missing NV FRU workaround
- name: NPIOOBFlash~NV_FRU_Check_WA
  retries: 1
  retry_rand_delay: 10
  proxy: controller
  args:
    allow_error: False
    fw_util: 'None'
    fw_file: 'tools/platforms/sanmiguel/utils/Check_NV_FRU.sh'
    copy_fw_util: False
    cmd: 'chmod +x {fw_file} && {fw_file}'

# ----- RTCDriftTest

- name: RTCDriftTest
  args:
    drift_check: false
    drift_threshold: 600
    skip_reboot: true

# ----- SEL clear

- name: SELClear
  timeout: 1800
  args:
    whitelist: {
      'sanmiguel': [
        'BMC-severity:OK-Event log cleared by user.',
        'BMC-severity:OK-com.meta.RedfishClient.UnexpectedException',
        'BMC-severity:OK-xyz.openbmc_project.Logging.Cleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Error.LogsCleared',
        'HMC-severity:OK-xyz.openbmc_project.Logging.Cleared'
      ],
    }

# check AP Status ready
- name: SanMiguelAPStatusCheck
  proxy: controller
  reboot: false
  args:
    sleep_time: 900
    retry: 2
    ap_name: 
      HGX_FW_BMC_0
      HGX_FW_ERoT_BMC_0
      HGX_FW_CPLD_0
      HGX_FW_CPLD_1
      HGX_FW_GPU_SMA_0
      HGX_FW_GPU_SMA_1
      HGX_FW_ProcessorModule_SMA_0
      HGX_FW_ProcessorModule_SMA_1
      HGX_SBIOS_FMC_0
      HGX_SBIOS_FMC_1
      HGX_SBIOS_FW_0
      HGX_SBIOS_FW_1
      HGX_FW_GPU_0
      HGX_FW_GPU_1
      HGX_FW_GPU_2
      HGX_FW_GPU_3

- name: HostUpCheck
  proxy: controller
  args:
    runtime: 3000

- name: LFOBMCNTPSetting~remove_controller_url
  args:
    remove: true

- name: BMCFlash~check_only
  proxy: controller
  args:
    check_only: true
    force_update: false
    postreboot: false 
    bmc_bootup_version_info: false
    fw_version: sanmiguel-v2026.26.1.quanta

