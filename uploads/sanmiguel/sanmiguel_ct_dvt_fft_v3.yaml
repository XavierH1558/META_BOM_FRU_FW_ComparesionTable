        vendor: samsung
        fw_version: LDD66F2Q
      MTFDLBT7T6THC-ABK4FABVAES:
        vendor: micron
        fw_version: E5FB004
      WUL6BA176O9P8X7:
        vendor: wd
        fw_version: RG109W0B

