# ----- ConfigCheck
- name: ConfigCheck
  args:
    fava_skip_tests: [ test_fw, test_fan_speed, test_hw, test_hw_cpu_cores_count, test_nic_info, test_uuid, test_check_slot, test_battery, test_mem_manufacturer]
    #fava_skip_tests: [ test_fw, test_fan_speed, test_hw, test_hw_cpu_cores_count, test_nic_info, test_uuid, test_check_slot]

# ----- SNCheck

- name: SNCheck
  args:
    fava_skip_tests: [test_cpu,test_dimm,test_mb]
    nic_entries: [
        "enP13s20f0np0",
        "enP1p3s0f0np0",
        "enP3s6f0np0",
        "enP4p3s0f0np0",
        "enP6s11f0np0",
        "enP9p3s0f0np0",
        "enP11s16f0np0",
        "enP12p3s0f0np0",
        "enP14s21f0np0"
    ]

# ----- PartCheck

- name: PartCheck
  args:
    fava_skip_tests: [test_motherboard, test_server, test_memory]

# ----- RTCDriftTest

- name: RTCDriftTest~check_only
  continue_on_fail: false
  args:
    clock_sync: false
    drift_threshold: 600

# ----- dmesg check

- name: DMESG_check
  #ignore_fail: '_all_'
  args:
    cycles: 1
    dmesg_filters_file: etc/dmesg_filters_sanmiguel.json
    dump_all_errors: true

# ----- SEL check

- name: SELCheck
#  retries: 2
#  retry_delay: 60
  args:
    cycles: 1
    hours_threshold: 24
    ucc_threshold : 0
    ecc_threshold: 100
    sel_filters_file: etc/sel_filters_sanmiguel.json
    product: sanmiguel
#    log_type: "redfish"
    dump_all_errors: true

